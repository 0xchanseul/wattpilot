name: Deploy

# Manual only: click "Run workflow" in the Actions tab. Automatic deploy-on-merge
# is deferred until the flow has proven itself (see TODO.md, section 2.2).
on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Re-verify the exact commit being deployed, same as ci.yml, rather than
      # trusting that CI already ran for whatever ref this was dispatched on.
      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          JWT_SECRET: dGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q=

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Only the commit-tagged image is pushed: deploy.sh pins the VM to that exact tag, so a moving
      # ":latest" would only add an image nothing deploys.
      - name: Build and push image
        run: |
          image="ghcr.io/${{ github.repository_owner }}/wattpilot-backend"
          docker build -t "$image:${{ steps.tag.outputs.value }}" .
          docker push "$image:${{ steps.tag.outputs.value }}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Lets required reviewers or branch restrictions be attached in Settings > Environments without
    # touching this file. The environment is created on first use if it does not exist yet.
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: frontend-dist
          path: frontend-dist

      # The VM's SSH host key is pinned in a secret instead of being fetched with ssh-keyscan at deploy
      # time: scanning trusts whatever answers on that address at that moment, so a man in the middle
      # would be trusted too. See docs/deployment.md, "CI/CD", for how to produce VM_KNOWN_HOSTS.
      - name: Set up deploy key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          if [ -z "$VM_KNOWN_HOSTS" ]; then
            echo "::error::The VM_KNOWN_HOSTS secret is not set; see docs/deployment.md, CI/CD."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/wattpilot_deploy
          chmod 600 ~/.ssh/wattpilot_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy backend
        run: |
          scp -i ~/.ssh/wattpilot_deploy deploy/azure/deploy.sh \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/wattpilot-deploy.sh"
          ssh -i ~/.ssh/wattpilot_deploy "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "chmod +x /tmp/wattpilot-deploy.sh && /tmp/wattpilot-deploy.sh ${{ needs.backend.outputs.image_tag }}"

      - name: Deploy frontend
        run: |
          rsync -a --delete -e "ssh -i ~/.ssh/wattpilot_deploy" \
            frontend-dist/ "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/wattpilot-dist/"
          ssh -i ~/.ssh/wattpilot_deploy "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "rsync -a --delete /tmp/wattpilot-dist/ /app/wattpilot/frontend/dist/"

      - name: Smoke check
        run: curl -fsS https://www.wattpilot.dev/actuator/health
