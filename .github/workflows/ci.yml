name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # The wrapper is committed without the executable bit (created on Windows).
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # Integration tests start PostgreSQL through Testcontainers, which uses the runner's Docker.
      # JWT_SECRET is normally read from the local .env file, which does not exist on the runner.
      # This is a throwaway test-only value, not a real secret.
      - name: Build and test
        run: ./gradlew build --no-daemon
        env:
          JWT_SECRET: dGVzdC1vbmx5LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q=

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # Production dependencies only: a build-tool advisory does not ship to users, but a high-severity
      # one in a library that does should block the build.
      - run: npm audit --omit=dev --audit-level=high

      # The build script runs the TypeScript project build before vite build.
      - run: npm run build
