# Default local HTTP port. 8080 is often taken by other local services
# (e.g. an Oracle XE XML DB listener), so the local profile uses 8081.
server:
  port: ${SERVER_PORT:8081}

spring:
  # Load shared local secrets from the repository-root .env file. The path is
  # resolved against the process working directory, which is the backend module
  # root (one level below the repository root) when running via Gradle bootRun or
  # the IDE. Optional so the app can also start from plain environment variables
  # (e.g. CI, container runs).
  config:
    import: optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:wattpilot}
    username: ${POSTGRES_USER:wattpilot}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

wattpilot:
  charging:
    execution:
      # Off by default for local development and tests so a background tick never runs against test
      # data mid-assertion. Set CHARGING_EXECUTION_ENABLED=true (or override here) to exercise it
      # locally; integration tests that specifically target the scheduler enable it themselves.
      enabled: ${CHARGING_EXECUTION_ENABLED:false}
      # To run the scheduler locally, or to inject a Mock Charging failure for a demo, use the
      # git-ignored repository-root .env file (imported above) rather than editing this tracked file.
      # See .env.example, "Mock Charging execution (optional overrides)".

  electricity:
    collection:
      # Do not hit the real Hva koster strømmen API during local development or tests.
      # Set PRICE_COLLECTION_ENABLED=true (or override here) to exercise the scheduler locally.
      enabled: ${PRICE_COLLECTION_ENABLED:false}

  security:
    cors:
      # Vite dev server default origin; the frontend calls the backend cross-origin.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
