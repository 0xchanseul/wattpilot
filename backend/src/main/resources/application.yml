spring:
  application:
    name: wattpilot-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  data:
    web:
      pageable:
        # Matches the Page/Size parameters in docs/openapi.yaml.
        default-page-size: 20
        max-page-size: 100

management:
  endpoints:
    web:
      exposure:
        # Only health is reachable over HTTP; other actuator endpoints (env, beans, etc.) could
        # leak configuration and are never exposed, in any profile.
        include: health
  endpoint:
    health:
      # Never show dependency details (DB, disk space) to an unauthenticated caller; health
      # checks only need the top-level UP/DOWN status.
      show-details: never
      # Serves /actuator/health/liveness and /actuator/health/readiness as sub-paths of the
      # health endpoint, so the exposure setting above still opens nothing else.
      probes:
        enabled: true
      group:
        readiness:
          # Listing the group members replaces the default (readinessState only). The database
          # belongs here and not in liveness: restarting the application does not fix a database
          # outage, so a database failure must not make the liveness check fail.
          include: readinessState,db

wattpilot:
  charging:
    # Fraction of grid energy that reaches the battery. V1 uses one system-wide value
    # (not stored per EV); it only lengthens the estimated charging duration, while the
    # billed energy and cost are computed on the full charger draw.
    efficiency: ${CHARGING_EFFICIENCY:0.9}

    execution:
      # 1-minute Mock Charging execution scheduler. Disabled for local development and tests
      # (see application-local.yml); enabled by default everywhere else.
      enabled: ${CHARGING_EXECUTION_ENABLED:true}
      # Fires every minute on the minute.
      cron: ${CHARGING_EXECUTION_CRON:0 * * * * *}
      # Maximum schedules processed per phase (complete / start / missed) per tick.
      batch-size: ${CHARGING_EXECUTION_BATCH_SIZE:100}
      # Attempts allowed for one phase (start or completion) before a transient error is finalized
      # as FAILED(SYSTEM_ERROR). A database failure that rolls back the whole attempt is retried
      # for free on the next tick and does not count against this budget.
      retry-max-attempts: ${CHARGING_EXECUTION_RETRY_MAX_ATTEMPTS:3}
      retry-initial-backoff: ${CHARGING_EXECUTION_RETRY_INITIAL_BACKOFF:PT1M}
      retry-backoff-multiplier: ${CHARGING_EXECUTION_RETRY_BACKOFF_MULTIPLIER:2.0}

      # Demo/test-only Mock Charging failure injection. Empty by default: mock charging always
      # succeeds. Map a charging-schedule id to the failure the adapter should simulate for it:
      #   CHARGER_UNAVAILABLE | VEHICLE_DISCONNECTED | START_REJECTED - start-phase business failure,
      #     the schedule ends FAILED immediately with no retry
      #   CHARGING_INTERRUPTED - completion-phase business failure (schedule reaches IN_PROGRESS first)
      #   SYSTEM_ERROR - the adapter throws on start, so the bounded retry above runs and the schedule
      #     ends FAILED(SYSTEM_ERROR) once the budget is exhausted
      # Set it per environment/profile (a Map does not override cleanly from a single env var):
      # mock:
      #   failures:
      #     12: CHARGER_UNAVAILABLE
      #     15: SYSTEM_ERROR

  electricity:
    collection:
      # Scheduled next-day price collection. Disabled for local development and tests
      # (see application-local.yml); enabled by default everywhere else.
      enabled: ${PRICE_COLLECTION_ENABLED:true}
      # Europe/Oslo 13:15, then hourly through 22:15. The 13:15 run collects most zones
      # (next-day prices are published just after 13:00 Oslo); later runs pick up any zone
      # that was not ready. Zones already stored in full are skipped.
      cron: ${PRICE_COLLECTION_CRON:0 15 13-22 * * *}
      # Time zone for the cron above and for resolving which date is "tomorrow".
      zone: ${PRICE_COLLECTION_ZONE:Europe/Oslo}

  integration:
    hva-koster-strommen:
      # Public electricity-price API (no key, no auth). Base URL without a trailing slash.
      base-url: ${HVA_KOSTER_STROMMEN_BASE_URL:https://www.hvakosterstrommen.no/api/v1}
      connect-timeout: ${HVA_KOSTER_STROMMEN_CONNECT_TIMEOUT:3s}
      read-timeout: ${HVA_KOSTER_STROMMEN_READ_TIMEOUT:5s}

  security:
    jwt:
      # Base64-encoded HS256 key of at least 32 bytes. Supplied per environment;
      # there is deliberately no default so a misconfigured deployment fails fast.
      secret: ${JWT_SECRET}
      issuer: wattpilot
      access-token-ttl: 30m
      # Absolute lifetime of a login session, measured from the initial login and never
      # extended by a refresh-token rotation. The remember-me value applies when the user
      # ticked "keep me signed in" at login; the default applies otherwise and to sign-up.
      session-ttl: 7d
      remember-me-session-ttl: 30d

    refresh-cookie:
      # The refresh token is delivered as an HttpOnly cookie whose lifetime tracks the
      # remaining session lifetime (jwt.session-ttl or jwt.remember-me-session-ttl, minus
      # the time already elapsed). Secure stays on by default (browsers accept it over
      # http://localhost); set it to false only when the API is served over plain HTTP on a
      # non-localhost host. Use same-site=None (with a real HTTPS origin) only when the frontend
      # and API are on unrelated sites.
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      domain: ${REFRESH_COOKIE_DOMAIN:}
