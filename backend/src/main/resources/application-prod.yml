spring:
  datasource:
    # Azure Database for PostgreSQL Flexible Server. Same POSTGRES_* variable convention as
    # application-cloud.yml, injected as container environment variables via deploy/azure/.env.
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?sslmode=require
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      # Fail startup instead of silently drifting if the deployed schema doesn't match
      # the entities. Mirrors application-local.yml.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

# Swagger UI and the raw OpenAPI JSON are public (see SecurityConfig), so they stay off in the
# real production environment. They remain enabled in local/cloud for development
# (see docs/deployment.md).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

wattpilot:
  security:
    cors:
      # No YAML default (unlike the local profile's localhost fallback): an unset value
      # binds to an empty string, which resolves to CorsProperties' own empty-list
      # default, so a misconfigured deployment fails closed (blocks all browser origins)
      # rather than accidentally allowing one that was only meant for local development.
      allowed-origins: ${CORS_ALLOWED_ORIGINS:}
