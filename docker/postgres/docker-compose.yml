services:
  postgres:
    image: postgres:16
    container_name: wattpilot-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wattpilot}
      POSTGRES_USER: ${POSTGRES_USER:-wattpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example in the repository root to .env}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - wattpilot-postgres-data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  wattpilot-postgres-data:
