# Runs on the production Azure VM. The database is Azure Database for PostgreSQL Flexible Server,
# not a container here. See docs/deployment.md, "Production Architecture (Azure)".
#
#   docker compose pull && docker compose up -d
#
services:
  backend:
    image: ${BACKEND_IMAGE:?set BACKEND_IMAGE in deploy/azure/.env}
    container_name: wattpilot-backend
    env_file:
      # Path relative to this file by convention. On the current production VM the real env file
      # lives at /etc/wattpilot/wattpilot.env instead — this line was hand-edited to point there;
      # check the VM's actual copy of this file rather than assuming the repo default applies.
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # B1s has 1 GiB RAM and this VM only runs the app; leave headroom for the OS.
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70.0
    ports:
      # Bound to localhost only: nginx is the public entry point and reverse-proxies to this
      # port (see deploy/azure/nginx/wattpilot.conf). The backend itself is never exposed
      # directly to the internet.
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      # Liveness only: a database outage must not mark the container unhealthy, because
      # restarting the application does not fix it. curl ships with the eclipse-temurin base image.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/actuator/health/liveness"]
      interval: 30s
      # Generous for a 1 vCPU VM where a GC pause or CPU-credit throttling can delay a response.
      timeout: 10s
      retries: 3
      # Failures during JVM startup and Flyway migrations do not count toward the retries.
      start_period: 60s
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
