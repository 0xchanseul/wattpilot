# nginx site config for the production Azure VM. See docs/deployment.md,
# "Production Architecture (Azure)".
#
# Install on the VM:
#   sudo cp wattpilot.conf /etc/nginx/sites-available/wattpilot
#   sudo ln -s /etc/nginx/sites-available/wattpilot /etc/nginx/sites-enabled/wattpilot
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates are managed separately by certbot; confirm the exact live/ directory name
# with `sudo certbot certificates` and adjust ssl_certificate(_key) below if it differs from
# "wattpilot.dev".
#
# wattpilot.dev is the apex; www.wattpilot.dev is canonical so the frontend's single
# VITE_API_BASE_URL (see frontend/.env.production) is always same-origin with the page.
#
# HTTP/2 uses the older `listen ... http2;` parameter (not the `http2 on;` directive added in
# nginx 1.25.1) for compatibility with Ubuntu 24.04's packaged nginx (1.24.x).

server {
    listen 80;
    listen [::]:80;
    server_name wattpilot.dev www.wattpilot.dev;

    # Required for certbot's HTTP-01 renewal challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.wattpilot.dev$request_uri;
    }
}

# Apex over HTTPS redirects to the canonical www host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wattpilot.dev;

    ssl_certificate     /etc/letsencrypt/live/wattpilot.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wattpilot.dev/privkey.pem;

    return 301 https://www.wattpilot.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wattpilot.dev;

    ssl_certificate     /etc/letsencrypt/live/wattpilot.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wattpilot.dev/privkey.pem;

    root /app/wattpilot/frontend/dist;
    index index.html;

    # React Router: any path not matching a static file falls back to the SPA shell.
    location / {
        try_files $uri /index.html;
    }

    # Backend REST API. Every controller is mapped under /api/v1 already (see
    # com.wattpilot.*.controller), so the prefix passes through unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
        proxy_set_header Host $host;
    }
}
