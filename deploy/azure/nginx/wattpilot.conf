# nginx site config for the production Azure VM. See docs/deployment.md,
# "Production Architecture (Azure)".
#
# Install on the VM:
#   sudo cp wattpilot.conf /etc/nginx/sites-available/wattpilot
#   sudo ln -s /etc/nginx/sites-available/wattpilot /etc/nginx/sites-enabled/wattpilot
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS certificates are managed separately by certbot; confirm the exact live/ directory name
# with `sudo certbot certificates` and adjust ssl_certificate(_key) below if it differs from
# "wattpilot.dev".
#
# wattpilot.dev is the apex; www.wattpilot.dev is canonical so the frontend's single
# VITE_API_BASE_URL (see frontend/.env.production) is always same-origin with the page.
#
# HTTP/2 uses the older `listen ... http2;` parameter (not the `http2 on;` directive added in
# nginx 1.25.1) for compatibility with Ubuntu 24.04's packaged nginx (1.24.x).

# Throttles the unauthenticated demo-login endpoint per client IP. The sustained rate is 5 requests
# per minute; the burst on the location below absorbs a few quick clicks. Defined at file level
# because site files are included inside nginx's http block. See docs/deployment.md, "Demo login".
limit_req_zone $binary_remote_addr zone=demo_login:10m rate=5r/m;

# Throttles the credential endpoints (login, sign-up) per client IP: each attempt costs a BCrypt
# verification, so an unthrottled flood both enables password guessing and exhausts the CPU.
limit_req_zone $binary_remote_addr zone=auth_credentials:10m rate=10r/m;

# Refresh runs on every page load for a signed-in visitor, so it gets a looser limit than login.
limit_req_zone $binary_remote_addr zone=auth_refresh:10m rate=60r/m;

# Coarse per-IP ceiling for every other API call, mainly to bound abuse of the endpoints that fan out
# to a third party (Smartcar telemetry) or write rows (EV, charging schedule, feedback).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# Spelled out so the minimum protocol does not depend on the packaged nginx's compiled-in default.
ssl_protocols TLSv1.2 TLSv1.3;

server {
    listen 80;
    listen [::]:80;
    server_name wattpilot.dev www.wattpilot.dev;

    # Required for certbot's HTTP-01 renewal challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.wattpilot.dev$request_uri;
    }
}

# Apex over HTTPS redirects to the canonical www host.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wattpilot.dev;

    ssl_certificate     /etc/letsencrypt/live/wattpilot.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wattpilot.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://www.wattpilot.dev$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.wattpilot.dev;

    ssl_certificate     /etc/letsencrypt/live/wattpilot.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wattpilot.dev/privkey.pem;

    root /app/wattpilot/frontend/dist;
    index index.html;

    server_tokens off;

    # Largest legitimate request body is a few hundred bytes of JSON. A small cap stops oversized
    # payloads before they reach the application's JSON parser.
    client_max_body_size 32k;

    # Declared at server level on purpose: nginx only inherits add_header into a location that
    # declares none of its own, so do not add add_header inside the locations below.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # frame-ancestors also replaces X-Frame-Options in modern browsers; the older header is kept for
    # browsers that ignore CSP. Fonts are bundled with the app, so everything is same-origin; the
    # charts and UI primitives set inline style attributes, hence 'unsafe-inline' for styles only.
    # Scripts are same-origin only: the production build has no inline script and no eval.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # The backend sets some of the same security headers on API responses; drop its copies so a
    # response carries each header once.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;

    # Shared by every proxied location below (a location that sets none of its own inherits these).
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # React Router: any path not matching a static file falls back to the SPA shell.
    location / {
        try_files $uri /index.html;
    }

    # Demo login: the same proxying as /api/ below, plus a per-IP rate limit. This exact-match
    # location wins over the prefix location; the original request URI is passed through unchanged.
    location = /api/v1/auth/demo {
        limit_req zone=demo_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @demo_rate_limited;

        proxy_pass http://127.0.0.1:8080;
    }

    # Same shape as the backend's error body, so the frontend shows this message instead of a
    # generic "Request failed" text.
    location @demo_rate_limited {
        default_type application/json;
        return 429 '{"status":429,"code":"TOO_MANY_REQUESTS","message":"Too many demo requests. Please wait a moment and try again."}';
    }

    # Backend REST API. Every controller is mapped under /api/v1 already (see
    # com.wattpilot.*.controller), so the prefix passes through unchanged.
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://127.0.0.1:8080/api/;
    }

    # Login and sign-up. The burst absorbs a few typos; a script guessing passwords is cut off. This
    # regex location outranks the /api/ prefix location above and repeats its proxy_pass, because
    # proxy_pass with a URI part is not allowed inside a regex location, so the original request URI
    # is passed through unchanged.
    location ~ ^/api/v1/auth/(login|signup)$ {
        limit_req zone=auth_credentials burst=10 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://127.0.0.1:8080;
    }

    location = /api/v1/auth/refresh {
        limit_req zone=auth_refresh burst=30 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://127.0.0.1:8080;
    }

    location @rate_limited {
        default_type application/json;
        return 429 '{"status":429,"code":"TOO_MANY_REQUESTS","message":"Too many requests. Please wait a moment and try again."}';
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8080/actuator/health;
    }
}
